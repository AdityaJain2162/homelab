# Node 1 — always-on infrastructure.
# Ubuntu Server 26.04 + Docker. See README.md for setup.
# All image tags pinned — update manually (no Watchtower).

services:
  adguard:
    image: adguard/adguardhome:v0.107.80
    container_name: adguardhome
    restart: unless-stopped
    network_mode: host    # DNS latency: binds :53/:3000 directly, no NAT/docker-proxy per packet
    # AdGuard's own config controls the binds: DNS :53 (tcp+udp), web UI :3000.
    # Keep web port 3000 — NPM owns :80/:443 for domain routing.
    volumes:
      - /opt/docker/appdata/adguardhome/work:/opt/adguardhome/work
      - /opt/docker/appdata/adguardhome/conf:/opt/adguardhome/conf

  npm:
    image: jc21/nginx-proxy-manager:2.16.0
    container_name: npm
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - /opt/docker/appdata/npm:/data
      - /opt/docker/appdata/npm/letsencrypt:/etc/letsencrypt   # REQUIRED — NPM exits without it
    environment:
      - TZ=${TZ}
      # NPM runs as root: its nginx binds :80/:443 inside the container and
      # uid-1000 can't hold low ports — cap_add/sysctls don't survive s6 setuid.
      - PUID=0
      - PGID=0

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.11.1
    container_name: homeassistant
    restart: unless-stopped
    ports:
      - "8123:8123"
    # NOTE: bridge mode limits mDNS/SSDP auto-discovery. If device discovery
    # matters, switch back to network_mode: host — :8123 doesn't collide.
    volumes:
      - /opt/docker/appdata/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ}

  # mosquitto — DISABLED: needs config/mosquitto/mosquitto.conf copied into
