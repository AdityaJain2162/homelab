  #     - ./config/vault:/vault/config:ro
  #     - /opt/docker/appdata/vault/tls:/vault/tls:ro
  #   command: server -config=/vault/config/vault.hcl
  #   environment:
  #     - TZ=${TZ}
  #     # lets `docker compose exec vault vault ...` verify the self-signed cert
  #     - VAULT_ADDR=https://127.0.0.1:8200
  #     - VAULT_CACERT=/vault/tls/vault.crt
  #     - VAULT_TLS_SERVER_NAME=vault.homelab

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"   # published host port — LAN + Node 2 scrape this
    pid: host
    command:
      - '--path.rootfs=/host'
      # NOTE: --collector.smartmon was removed upstream in node-exporter v1.9.
      # SMART metrics come via scripts/smart-textfile.py + systemd timer
      # writing .prom files here (host path /var/lib/node-exporter).
      - '--collector.textfile.directory=/host/var/lib/node-exporter'
    volumes:
      - '/:/host:ro,rslave'

  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.155.0
    container_name: victoria-metrics
    restart: unless-stopped
    ports:
      - "${VICTORIAMETRICS_PORT:-8428}:8428"
    volumes:
      - /opt/docker/appdata/victoria-metrics:/storage
      - ./config/vm:/etc/vm:ro
    command:
      - '-retentionPeriod=3'          # months — 3-month metric retention
      - '-httpListenAddr=:8428'
      - '-promscrape.config=/etc/vm/scrape.yml'
      - '-storageDataPath=/storage'

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "${CADVISOR_PORT:-8080}:8080"
    privileged: true   # cAdvisor needs host cgroup/device access for full metrics
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      # Athlon II is weak — defaults (10s housekeeping, all metric sets) eat CPU.
      - '--housekeeping_interval=30s'   # was 10s — matches our 30s scrape interval
      - '--docker_only=true'            # skip raw cgroup stats, docker containers only
      - '--disable_metrics=diskIO,percpu,tcp,udp,process,hugetlb,cpu_topology,resctrl,memory_numa,app,cpuset,sched,referenced_memory,perf_event,cpuLoad'

  blackbox:
    image: prom/blackbox-exporter:v0.29.1
    container_name: blackbox
    restart: unless-stopped
    ports:
      - "${BLACKBOX_PORT:-9115}:9115"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach host-networked AdGuard for probes
    volumes:
      - ./config/blackbox:/etc/blackbox_exporter:ro
    command:
      - '--config.file=/etc/blackbox_exporter/blackbox.yml'

  grafana:
    image: grafana/grafana:13.2.5
    container_name: grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3002}:3000"    # internal :3000; host :3000 is AdGuard, :3001 is Kuma (parked)
    volumes:
      - /opt/docker/appdata/grafana:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro
    environment:
      - TZ=${TZ}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false

  homepage:
    image: ghcr.io/gethomepage/homepage:v2.7.0
    container_name: homepage
    restart: unless-stopped
    ports:
      - "${HOMEPAGE_PORT:-3003}:3000"
    volumes:
      - ./config/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro   # container status dots
    environment:
      - TZ=${TZ}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_ALLOWED_HOSTS:-home.homelab,192.168.1.60:3003}

