# Node 1 — always-on infrastructure.
# Ubuntu Server 26.04 + Docker. See README.md for setup.
# All image tags pinned — update manually (no Watchtower).

services:
  adguard:
    image: adguard/adguardhome:v0.107.80
    container_name: adguardhome
    restart: unless-stopped
    ports:
      - "53:53/tcp"    # DNS
      - "53:53/udp"    # DNS
      - "3000:3000"    # admin UI — set AdGuard web port to 3000 in its settings (NPM owns :80)
    volumes:
      - /opt/docker/appdata/adguardhome/work:/opt/adguardhome/work
      - /opt/docker/appdata/adguardhome/conf:/opt/adguardhome/conf

  # npm — DISABLED: crash-looping on Node 1, root cause TBD. Re-enable after
  # `docker compose logs npm` is diagnosed. Data persists in /opt/docker/appdata/npm.
  # npm:
  #   image: jc21/nginx-proxy-manager:2.16.0
  #   container_name: npm
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #     - "81:81"        # admin UI
  #   volumes:
  #     - /opt/docker/appdata/npm:/data
  #   environment:
  #     - TZ=${TZ}
  #     - PUID=${PUID}
  #     - PGID=${PGID}

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.11.1
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host    # required for mDNS/SSDP device discovery
    volumes:
      - /opt/docker/appdata/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ}

  # mosquitto — DISABLED: needs config/mosquitto/mosquitto.conf copied into
  # /opt/docker/appdata/mosquitto/config/ + passwordfile (see README). Data persists.
  # mosquitto:
  #   image: eclipse-mosquitto:2.1.2-alpine
  #   container_name: mosquitto
  #   restart: unless-stopped
  #   ports:
  #     - "1883:1883"    # MQTT — Zigbee2MQTT here, Frigate on Node 2
  #     - "9001:9001"    # MQTT over WebSockets
  #   volumes:
  #     - /opt/docker/appdata/mosquitto/config:/mosquitto/config
  #     - /opt/docker/appdata/mosquitto/data:/mosquitto/data
  #     - /opt/docker/appdata/mosquitto/log:/mosquitto/log
  #   environment:
  #     - TZ=${TZ}

  # uptime-kuma — DISABLED for now. Data persists in /opt/docker/appdata/uptime-kuma.
  # uptime-kuma:
  #   image: louislam/uptime-kuma:2.5.9    # NB: :latest still points at v1 — keep pinned
  #   container_name: uptime-kuma
  #   restart: unless-stopped
  #   ports:
  #     - "3001:3001"
  #   volumes:
  #     - /opt/docker/appdata/uptime-kuma:/app/data
  #   environment:
  #     - TZ=${TZ}

  tailscale:
    image: tailscale/tailscale:v1.104.4
    container_name: tailscale
    hostname: ${NODE1_NAME:-node1}
    restart: unless-stopped
    network_mode: host    # REQUIRED — puts tailscale0 on the host netns so the
                          # NODE itself is reachable over the tailnet (SSH, web UIs).
                          # Bridge mode would only give the container its own tailnet IP.
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      # - TS_AUTHKEY=tskey-auth-...   # optional headless auth; else: docker compose exec tailscale tailscale up
    volumes:
      - /opt/docker/appdata/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - net_raw

  # vault — DISABLED (parked): needs /opt/docker/appdata/vault/{data,tls}
  # chowned to uid 100, then `vault operator init`. See docs/vault.md.
  # vault:
  #   image: hashicorp/vault:2.2.1
  #   container_name: vault
  #   restart: unless-stopped
  #   ports:
  #     - "8200:8200"    # API + UI (TLS). TODO: restrict to VLAN 99 / tailnet at ER605.
  #   cap_add:
  #     - IPC_LOCK      # mlock — required for prod mode
  #   volumes:
  #     - /opt/docker/appdata/vault/data:/vault/data
  #     - ./config/vault:/vault/config:ro
  #     - /opt/docker/appdata/vault/tls:/vault/tls:ro
  #   command: server -config=/vault/config/vault.hcl
  #   environment:
  #     - TZ=${TZ}
  #     # lets `docker compose exec vault vault ...` verify the self-signed cert
  #     - VAULT_ADDR=https://127.0.0.1:8200
  #     - VAULT_CACERT=/vault/tls/vault.crt
  #     - VAULT_TLS_SERVER_NAME=vault.homelab

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host    # exposes :9100 on the LAN for VictoriaMetrics on Node 2
    pid: host
    command:
      - '--path.rootfs=/host'
      # NOTE: --collector.smartmon was removed upstream in node-exporter v1.9.
      # SMART metrics come via scripts/smart-textfile.py + systemd timer
      # writing .prom files here (host path /var/lib/node-exporter).
      - '--collector.textfile.directory=/host/var/lib/node-exporter'
    volumes:
      - '/:/host:ro,rslave'

  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.155.0
    container_name: victoria-metrics
    restart: unless-stopped
    ports:
      - "8428:8428"    # Prometheus-compatible storage + query API + UI
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach host-network svcs (:9100, :19999)
    volumes:
      - /opt/docker/appdata/victoria-metrics:/storage
      - ./config/vm:/etc/vm:ro
    command:
      - '-retentionPeriod=3'          # months — 3-month metric retention
      - '-promscrape.config=/etc/vm/scrape.yml'
      - '-storageDataPath=/storage'

  grafana:
    image: grafana/grafana:13.2.5
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3002:3000"    # admin UI — 3000 is AdGuard, 3001 was Kuma
    volumes:
      - /opt/docker/appdata/grafana:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro
    environment:
      - TZ=${TZ}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false

  # zigbee2mqtt — uncomment when the USB coordinator arrives.
  # Find the device path first: ls -l /dev/serial/by-id/
  # zigbee2mqtt:
  #   image: ghcr.io/koenkk/zigbee2mqtt:latest   # TODO: pin a version tag at deploy
  #   container_name: zigbee2mqtt
  #   restart: unless-stopped
  #   devices:
  #     - /dev/serial/by-id/usb-Itead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_XXXX:/dev/ttyUSB0
  #   volumes:
  #     - /opt/docker/appdata/zigbee2mqtt:/app/data
  #     - /run/udev:/run/udev:ro
  #   ports:
  #     - "8099:8080"    # frontend
  #   environment:
  #     - TZ=${TZ}
