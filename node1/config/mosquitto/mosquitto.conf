# Mosquitto 2.x config — copy to /opt/docker/appdata/mosquitto/config/mosquitto.conf
# Generate passwordfile first (see node1/README.md):
#   docker run --rm -v /opt/docker/appdata/mosquitto/config:/mosquitto/config \
#     eclipse-mosquitto:2.1.2-alpine mosquitto_passwd -c /mosquitto/config/passwordfile <user>

per_listener_settings true

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwordfile

listener 9001
protocol websockets
allow_anonymous false
password_file /mosquitto/config/passwordfile

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
