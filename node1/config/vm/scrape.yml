# VictoriaMetrics scrape config — node1/docker-compose.yml mounts this at /etc/vm.
# Bridge networking → targets are compose service names on internal ports.
# AdGuard is the one host-networked service → reached via host.docker.internal
# (extra_hosts is set on the blackbox service for the probes below).
# .env port vars only change PUBLISHED host ports — internal ports are fixed,
# so this file doesn't need to match them.

global:
  scrape_interval: 15s

scrape_configs:
  # node-exporter :9100 — CPU/RAM/disk/network/load/fs + hwmon temps/fans
  - job_name: node1
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: node1

  # cadvisor :8080 — per-container CPU/memory/network/block IO
  - job_name: cadvisor
    scrape_interval: 30s
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          instance: node1

  # blackbox :9115 — HTTP probes of service UIs (probe_success, probe_duration_seconds)
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_ok]
    static_configs:
      - targets:
          - host.docker.internal:3000              # AdGuard admin UI (host-networked)
          - grafana:3000                          # Grafana UI
          - http://victoria-metrics:8428/vmui/   # VM UI — probe /vmui/ path, root / is unreliable
          - homeassistant:8123                    # Home Assistant
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
