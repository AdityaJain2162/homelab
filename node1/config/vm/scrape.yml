# VictoriaMetrics scrape config — node1/docker-compose.yml mounts this at /etc/vm.
# Targets use host.docker.internal (extra_hosts → host-gateway) since node-exporter
# runs with network_mode: host.

global:
  scrape_interval: 15s

scrape_configs:
  # node-exporter :9100 — CPU/RAM/disk/network/load/fs + hwmon temps/fans
  - job_name: node1
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels:
          instance: node1
