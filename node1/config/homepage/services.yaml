# ══════════════════════════════════════════════════════════════════════
# Service tiles on home.homelab
#   container: → live status dot via docker.sock — must match
#                container_name in docker-compose.yml
#   href:      → *.homelab names → AdGuard wildcard → NPM :80 proxy hosts
#   {{HOMEPAGE_VAR_*}} → env vars passed via compose (NODE*_IP from .env)
#   icon: → bundled (foo.png) / si-* / mdi-* / sh-* — wrong name = blank
#   widget: → live stats inside the tile; the commented examples need
#             creds added as HOMEPAGE_VAR_* env vars — never commit secrets
# ══════════════════════════════════════════════════════════════════════

- Core:
    - AdGuard Home:
        icon: adguardhome.png
        href: http://adguard.homelab
        description: DNS · ad blocking
        container: adguardhome
        # live query/block stats — add HOMEPAGE_VAR_ADGUARD_USER and
        # HOMEPAGE_VAR_ADGUARD_PASSWORD to compose env + .env, then uncomment:
        # widget:
        #   type: adguardhome
        #   url: http://{{HOMEPAGE_VAR_NODE1_IP}}:3000
        #   username: "{{HOMEPAGE_VAR_ADGUARD_USER}}"
        #   password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"

    - Nginx Proxy Manager:
        icon: nginxproxymanager.png
        href: http://{{HOMEPAGE_VAR_NODE1_IP}}:81
        description: Reverse proxy · *.homelab
        container: npm

    - Homepage:
        icon: homepage.png
        href: http://home.homelab
        description: You are here
        container: homepage

    - Tailscale:
        icon: tailscale.png
        href: https://login.tailscale.com/admin/machines
        description: Mesh VPN admin console
        # container: tailscale    # uncomment once enabled in compose

- Smart Home:
    - Home Assistant:
        icon: homeassistant.png
        href: http://homeassistant.homelab
        description: Automation hub
        container: homeassistant
        # entity/state widget — needs a long-lived token (HA profile →
        # security → long-lived access tokens) as HOMEPAGE_VAR_HA_TOKEN:
        # widget:
        #   type: homeassistant
        #   url: http://homeassistant:8123
        #   key: "{{HOMEPAGE_VAR_HA_TOKEN}}"

    - Mosquitto MQTT:
        icon: mqtt.png
        description: Broker · :1883 — parked

    - Zigbee2MQTT:
        icon: zigbee2mqtt.png
        href: http://{{HOMEPAGE_VAR_NODE1_IP}}:8099
        description: Zigbee bridge — parked

- Observability:
    - Grafana:
        icon: grafana.png
        href: http://grafana.homelab
        description: Dashboards + alerts
        container: grafana

    - VictoriaMetrics:
        icon: victoriametrics.png
        href: http://vm.homelab
        description: Metrics TSDB · 3-mo retention
        container: victoria-metrics

    - cAdvisor:
        icon: cadvisor.png
        href: http://{{HOMEPAGE_VAR_NODE1_IP}}:8080
        description: Container metrics
        container: cadvisor

    - Node Exporter:
        icon: prometheus.png
        href: http://{{HOMEPAGE_VAR_NODE1_IP}}:9100/metrics
        description: Host metrics
        container: node-exporter

    - Blackbox Exporter:
        icon: mdi-radar
        href: http://{{HOMEPAGE_VAR_NODE1_IP}}:9115
        description: HTTP probes
        container: blackbox

