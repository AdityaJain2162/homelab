# Grafana-managed alert rules — provisioned at /etc/grafana/provisioning/alerting.
# Rules land in the "Homelab" folder (create it once in the UI if provisioning
# reports "folder not found"). No notification channel yet — alerts are visible
# under Alerting → Alert rules; wire a contact point later.
apiVersion: 1

groups:
  - orgId: 1
    name: node1-infrastructure
    folder: Homelab
    interval: 1m
    rules:
      # --- availability -------------------------------------------------
      - uid: node1-scrape-target-down
        title: Scrape target down
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: victoria-metrics
            model:
              refId: A
              expr: up{job=~"node1|cadvisor|blackbox"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }
        noDataState: Alerting
        execErrState: Error
        for: 2m
        annotations:
          summary: "Scrape target {{ $labels.job }} / {{ $labels.instance }} is down"
        labels:
          severity: critical
          node: node1
        isPaused: false

      - uid: node1-service-probe-failed
        title: Service UI probe failed
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: victoria-metrics
            model:
              refId: A
              expr: probe_success{job="blackbox"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }
        noDataState: OK
        execErrState: Error
        for: 3m
        annotations:
          summary: "HTTP probe failing for {{ $labels.instance }}"
        labels:
          severity: warning
          node: node1
        isPaused: false

      # --- resources ----------------------------------------------------
      - uid: node1-cpu-high
        title: CPU usage high
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: victoria-metrics
            model:
              refId: A
              expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [90] }
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: "Node 1 CPU above 90% for 10m ({{ $values.B }}%)"
        labels:
          severity: warning
          node: node1
        isPaused: false

      - uid: node1-memory-high
        title: Memory usage high
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: victoria-metrics
            model:
              refId: A
              expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [90] }
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: "Node 1 RAM above 90% for 10m ({{ $values.B }}%)"
        labels:
          severity: warning
          node: node1
        isPaused: false

      - uid: node1-disk-root-high
        title: Root filesystem nearly full
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: victoria-metrics
            model:
              refId: A
              expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint="/",fstype="ext4"} / node_filesystem_size_bytes{mountpoint="/",fstype="ext4"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [85] }
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Node 1 root filesystem above 85% ({{ $values.B }}%)"
        labels:
          severity: warning
          node: node1
        isPaused: false

      - uid: node1-load-high
        title: Load average high
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: victoria-metrics
            model:
              refId: A
              expr: node_load15
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [4] }
        noDataState: OK
        execErrState: Error
        for: 15m
        annotations:
          summary: "Node 1 load15 above 4 for 15m ({{ $values.B }}) — 2-core box is saturated"
        labels:
          severity: warning
          node: node1
        isPaused: false

      # --- drive health -------------------------------------------------
      - uid: node1-ssd-temp-high
        title: SSD temperature high
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: victoria-metrics
            model:
              refId: A
              expr: node_smart_temperature_celsius
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [60] }
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Drive {{ $labels.disk }} above 60°C ({{ $values.B }}°C)"
        labels:
          severity: warning
          node: node1
        isPaused: false
