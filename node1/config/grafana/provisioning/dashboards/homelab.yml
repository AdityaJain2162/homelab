# Dashboard provisioning — loads JSON files from /etc/grafana/dashboards.
apiVersion: 1

providers:
  - name: homelab
    orgId: 1
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
