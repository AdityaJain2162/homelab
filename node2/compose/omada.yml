# DRAFT — Node 2. Omada SDN Controller (community image, bundles MongoDB 8 → needs AVX).
# network_mode: host is REQUIRED — L2 adoption broadcasts don't cross bridge networks.
# Run from node2/: docker compose --env-file .env -f compose/omada.yml up -d
name: node2-omada

services:
  omada-controller:
    image: mbentley/omada-controller:6.3
    container_name: omada-controller
    restart: unless-stopped
    network_mode: host
    stop_grace_period: 60s        # MongoDB needs a clean shutdown
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - /opt/docker/appdata/omada/data:/opt/tplink/EAPController/data
      - /opt/docker/appdata/omada/logs:/opt/tplink/EAPController/logs
    # Web UI: https://$NODE2_IP:8043  |  HTTP: :8088  |  portal: :8843
