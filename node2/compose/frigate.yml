# DRAFT — Node 2. Verify image tag at deploy time. See node2/README.md.
# go2rtc is bundled inside Frigate — no separate container needed.
name: node2-frigate

services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.18.2
    container_name: frigate
    restart: unless-stopped
    stop_grace_period: 60s
    shm_size: "512mb"
    devices:
      - /dev/dri:/dev/dri    # Intel iGPU — VAAPI decode + OpenVINO detector
    volumes:
      - /opt/docker/appdata/frigate/config:/config   # put config.yml here — see node2/config/frigate/config.yml
      - /media/frigate/recordings:/media/frigate/recordings   # dedicated ext4 disk — NEVER NFS/ZFS
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "5000:5000"       # web UI
      - "8554:8554"       # RTSP restream (go2rtc)
      - "8555:8555/tcp"   # WebRTC
      - "8555:8555/udp"
      - "1984:1984"       # go2rtc API
    environment:
      - TZ=${TZ}
