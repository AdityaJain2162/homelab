# DRAFT — Node 2. Mirrors Immich's official compose (v3.3.6).
# Run from node2/: docker compose --env-file .env -f compose/immich.yml up -d
name: node2-immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION}
    volumes:
      - ${UPLOAD_LOCATION}:/data            # ZFS datapool/photos
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - ../.env
    ports:
      - "2283:2283"
    depends_on:
      - redis
      - database
    restart: always

  immich-machine-learning:
    container_name: immich_machine_learning
    # -openvino suffix → Intel iGPU (UHD 630) inference instead of CPU
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION}-openvino
    volumes:
      - model-cache:/cache
    env_file:
      - ../.env
    devices:
      - /dev/dri:/dev/dri
    restart: always

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9        # official compose uses Valkey, not Redis
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data   # SSD — keep DB off ZFS
    shm_size: 128mb
    restart: always

volumes:
  model-cache:
