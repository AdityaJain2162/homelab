# Node 2 — secondary DNS (AdGuard Home). Same pinned image as Node 1.
# Settings must MATCH the Node 1 instance (upstream + rewrites + blocklists)
# or clients get inconsistent answers depending on which server answered.
# Easiest path: configure Node 1 first, then Settings → export AdGuardHome.yaml
# and import it here (IPs inside are identical on both nodes).
# Run from node2/: docker compose --env-file .env -f compose/dns.yml up -d
name: node2-dns

services:
  adguard:
    image: adguard/adguardhome:v0.107.80
    container_name: adguardhome
    restart: unless-stopped
    ports:
      - "53:53/tcp"    # DNS
      - "53:53/udp"    # DNS
      - "${ADGUARD_WEB_PORT:-3001}:3000"   # admin UI — 3000 is Grafana on this node
    volumes:
      - /opt/docker/appdata/adguardhome/work:/opt/adguardhome/work
      - /opt/docker/appdata/adguardhome/conf:/opt/adguardhome/conf
