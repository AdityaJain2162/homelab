# DRAFT — Node 2 monitoring stack. Verify image tags at deploy time.
# Host networking throughout (same pattern as Node 1) — services bind ports
# directly; keep node2/.env port vars and scrape targets in sync.
# Run from node2/: docker compose --env-file .env -f compose/monitoring.yml up -d
name: node2-monitoring

services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.155.0
    container_name: victoriametrics
    restart: unless-stopped
    network_mode: host    # binds :8428 directly
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=6"        # ~6 months of metrics
      - "-httpListenAddr=:${VICTORIAMETRICS_PORT:-8428}"
    volumes:
      - /opt/docker/appdata/monitoring/victoriametrics:/storage

  grafana:
    image: grafana/grafana:13.2.5
    container_name: grafana
    restart: unless-stopped
    network_mode: host    # binds GF_SERVER_HTTP_PORT directly — :3000 here (AdGuard web is :3001)
    environment:
      - GF_SERVER_HTTP_PORT=${GRAFANA_PORT:-3000}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      - TZ=${TZ}
    volumes:
      - /opt/docker/appdata/monitoring/grafana:/var/lib/grafana
      - ../config/grafana/provisioning:/etc/grafana/provisioning:ro

  loki:
    image: grafana/loki:3.7.9
    container_name: loki
    restart: unless-stopped
    network_mode: host    # binds :3100 per config/loki/loki.yaml
    volumes:
      - ../config/loki/loki.yaml:/etc/loki/local-config.yaml:ro
      - /opt/docker/appdata/monitoring/loki:/loki

  alloy:
    image: grafana/alloy:v1.21.3
    container_name: alloy
    restart: unless-stopped
    network_mode: host    # binds ALLOY_PORT directly
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:${ALLOY_PORT:-12345}
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      - NODE1_EXPORTER_ADDR=${NODE1_EXPORTER_ADDR:?set NODE1_EXPORTER_ADDR in .env}
      - TZ=${TZ}
    volumes:
      - ../config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro    # docker log shipping
      - /var/log/journal:/var/log/journal:ro            # journald logs
      - /run/log/journal:/run/log/journal:ro
      # journal source may need privileged: true if entries are empty — verify at deploy
      - /opt/docker/appdata/monitoring/alloy:/var/lib/alloy/data

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: cadvisor
    restart: unless-stopped
    network_mode: host    # binds :8085 — :8080 is qBittorrent on this node
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - '--port=${CADVISOR_PORT:-8085}'

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - '--path.rootfs=/host'
      - '--web.listen-address=:${NODE_EXPORTER_PORT:-9100}'
      - '--collector.smartmon'   # SMART attrs/temps — needs smartmontools on host (ansible: hardware_monitor role)
    volumes:
      - '/:/host:ro,rslave'
