# Homelab inventory — keep ansible_host in sync with node*/.env
# (NODE1_IP / NODE2_IP). ansible_user = your login user on the nodes.
# Passwords are NEVER stored in this public repo — use SSH keys
# (ssh-copy-id) or pass --ask-become-pass / --ask-pass at runtime.
#
# Usage:
#   ansible-playbook site.yml --limit node1     # provision Node 1 only
#   ansible-playbook site.yml                   # both nodes
#   ansible node1 -m ping                      # connectivity check

[homelab:children]
node1
node2

[node1]
node1 ansible_host=192.168.1.60 ansible_user=bruce

[node2]
# Node 2 IP TBD at purchase — placeholder on the same LAN subnet
node2 ansible_host=192.168.1.10 ansible_user=bruce
