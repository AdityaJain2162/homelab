---
# Host-level hardware monitoring on every node:
# smartmontools (smartd → SMART alerts) + lm-sensors (sensors CLI).
# Alert delivery via scripts/hw-alert.sh → Telegram/Discord.
# node-exporter exposes the same data as metrics (smartmon collector)
# once smartmontools is present.

- name: Install SMART + sensor packages
  ansible.builtin.apt:
    name:
      - smartmontools
      - lm-sensors
    state: present
    update_cache: true

# hwmon kernel modules — board-specific Super I/O / CPU temp drivers.
# node-exporter's hwmon collector only sees sensors these expose.
# NB: other boards may need different modules (e.g. nct6775) — check `sensors`.
- name: Persist hwmon kernel modules
  ansible.builtin.lineinfile:
    path: /etc/modules
    line: "{{ item }}"
    state: present
  loop:
    - it87      # ITE IT87xx Super I/O — fans + motherboard temps (Node 1 ASUS board)
    - k10temp   # AMD CPU temp (Athlon II)

- name: Load hwmon kernel modules now
  ansible.builtin.command: "modprobe {{ item }}"
  loop:
    - it87
    - k10temp
  changed_when: false
  failed_when: false   # module may not bind on boards without the chip

- name: Deploy smartd.conf
  ansible.builtin.copy:
    src: smartd.conf
    dest: /etc/smartd.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart smartmontools

- name: Deploy hw-alert.sh dispatcher
  ansible.builtin.copy:
    src: "{{ repo_dir }}/scripts/hw-alert.sh"
    dest: /usr/local/sbin/hw-alert.sh
    remote_src: yes
    owner: root
    group: root
    mode: "0755"

- name: Deploy alert targets file (only if missing — never overwrite)
  ansible.builtin.copy:
    src: homelab-alert.env
    dest: /etc/homelab-alert.env
    force: no
    owner: root
    group: root
    mode: "0600"

- name: Enable and start smartmontools
  ansible.builtin.systemd:
    name: smartmontools
    enabled: true
    state: started
