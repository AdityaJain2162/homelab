# /etc/smartd.conf — managed by ansible role hardware_monitor (edits overwritten)
#
# -a: monitor all SMART attributes
# -o on: enable offline data collection (background attribute reads)
# -S on: autosave attribute values between runs (enables trend detection)
# -s: self-test schedule — short weekly Sun 02:00, long monthly Sat 03:00
# -M exec: pipe alerts to hw-alert.sh → Telegram/Discord
#   (fallback if -M exec is unsupported on your smartmontools:
#    use '-m you@example.com' and configure an MTA instead)
DEVICESCAN -a -o on -S on -s (S/../.././02|L/../../6/03) -M exec /usr/local/sbin/hw-alert.sh
